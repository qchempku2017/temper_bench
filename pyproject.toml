[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "temper-bench"
dynamic = ["version"]
description = "Data preparation and fine-tuning evaluation tools for the TEMPER MLFF benchmark"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ase",
    "monty",
    "numpy==2.5.2",
    "pydantic>=2.0.0",
    "ruamel.yaml",
]

[project.optional-dependencies]
remote = [
    "dpdispatcher==1.0.3",
]
bohrium = [
    "dpdispatcher[bohrium]==1.0.3",
    "bohrium-sdk==0.15.0",
]
preprocess = [
    "numba",
    "quests==2026.2.22",
]
test = [
    "pytest",
    "PyYAML",
]
gpu = [
    "torch",
]

[project.scripts]
temper_bench = "temper.entrypoints.main:main"

[project.urls]
Repository = "https://github.com/qchempku2017/temper_bench"

[tool.setuptools.packages.find]
where = ["src"]
include = ["temper*"]

[tool.setuptools.dynamic]
version = {attr = "temper._version.__version__"}

[tool.setuptools.package-data]
"temper.mlff" = ["default_pretrained_models.json"]
