[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "temper-bench"
dynamic = ["version"]
description = "Data preparation and fine-tuning evaluation tools for the TEMPER MLFF benchmark"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ase",
    "monty",
    "numpy>=2.0,<3",
    "pydantic>=2.0.0",
    "ruamel.yaml",
]

# Submission workstation: install temper-bench[remote,preprocess]. Add gpu for
# GPU entropy calculations, or bohrium only for Bohrium submission.
# Execution machine: install base temper-bench in each MLFF backend environment.
# See README.md for GPU prerequisites and Bohrium setup documentation.
[project.optional-dependencies]
remote = [
    "dpdispatcher==1.0.3",
]
bohrium = [
    "dpdispatcher[bohrium]==1.0.3",
    "bohrium-sdk==0.15.0",
]
preprocess = [
    "numba",
    "quests==2026.2.22",
]
test = [
    "pytest",
    "PyYAML",
]
gpu = [
    "torch",
]

[project.scripts]
temper_bench = "temper.entrypoints.main:main"

[project.urls]
Repository = "https://github.com/qchempku2017/temper_bench"

[tool.setuptools.packages.find]
where = ["src"]
include = ["temper*"]

[tool.setuptools.dynamic]
version = {attr = "temper._version.__version__"}

[tool.setuptools.package-data]
"temper.mlff" = ["default_pretrained_models.json"]

[tool.black]
line-length = 79
target-version = ["py311"]

[tool.docformatter]
wrap-summaries = 72
wrap-descriptions = 72
